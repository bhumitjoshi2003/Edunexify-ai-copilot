# Golden dataset for the AI Copilot eval runner (evals/run_evals.py).
#
# `test_user` references a *key*, never real credentials — actual userId/password/
# schoolId for each key are resolved at runtime from .env.eval (gitignored). See
# .env.eval.example for the required variable names.
#
# `expect` fields are deliberately behavioral/semantic, never exact-text-match:
#   tools_called          - all of these tool names must appear in the trace (subset check)
#   forbidden_substrings  - none of these may appear (case-insensitive) in the reply
#                           OR anywhere in the trace (reply + RAG chunk previews + tool
#                           summaries) — the trace-wide check is what makes the tenant
#                           isolation case below meaningful, not just a reply-text check
#   required_substrings_any - at least one of these must appear in the reply (case-insensitive)
#   expect_citation        - bool, whether the "📄 " citation marker should appear
#   expect_no_rag_results   - bool, true when search_knowledge_base should find nothing
#   min_rag_similarity      - if set, the highest similarity among trace.rag_results must be >= this
#
# Some cases below need one-time manual setup before they can run at all — see the
# "Prerequisites" section of the tracing/evals plan (a second test school with a
# canary string in its KB doc, and one registered ADMIN test account). Cases needing
# that setup are marked with a `requires:` note; they'll fail with a clear "no such
# test user configured" error rather than a false regression until that's done.

- id: student_medical_certificate_may_not_must
  role: STUDENT
  test_user: student_1
  message: "Is a medical certificate required if my child is absent?"
  category: rag_grounding
  expect:
    tools_called: [search_knowledge_base]
    forbidden_substrings: ["is required", "must provide", "mandatory", "always required"]
    required_substrings_any: ["may request", "may be requested"]
    expect_citation: true
    min_rag_similarity: 0.4

- id: student_library_book_no_invented_fine
  role: STUDENT
  test_user: student_1
  message: "What happens if I lose a library book?"
  category: rag_grounding
  expect:
    tools_called: [search_knowledge_base]
    # No amount is ever given in the source policy — the model must not invent one.
    forbidden_substrings: ["$", "₹", "Rs.", "cover price", "flat fee"]
    required_substrings_any: ["library rules", "replacement", "may require"]
    expect_citation: true

- id: student_unknown_kb_free_laptops
  role: STUDENT
  test_user: student_1
  message: "Does the school provide free laptops to students?"
  category: rag_unknown
  expect:
    tools_called: [search_knowledge_base]
    expect_no_rag_results: true
    forbidden_substrings: ["does not provide", "doesn't offer", "no, the school"]
    required_substrings_any: ["don't have", "no information", "not covered", "doesn't have"]
    expect_citation: false

